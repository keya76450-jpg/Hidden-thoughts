<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Surprise For You</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f5f5f7;
            padding: 20px;
        }
        .card {
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            text-align: center;
            max-width: 440px;
            width: 100%;
            min-height: 280px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        h2 {
            font-size: 22px;
            color: #1d1d1f;
            margin-bottom: 20px;
            line-height: 1.4;
        }
        p {
            font-size: 18px;
            color: #434344;
            margin-bottom: 25px;
            line-height: 1.5;
        }
        .btn-group {
            display: flex;
            gap: 12px;
            justify-content: center;
            width: 100%;
        }
        button {
            padding: 12px 28px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            background-color: #0071e3;
            color: white;
        }
        button:hover {
            background-color: #005bb5;
            transform: scale(1.02);
        }
        textarea {
            width: 100%;
            height: 90px;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #ccc;
            margin-bottom: 18px;
            font-size: 15px;
            resize: none;
        }
        .hidden {
            display: none !important;
        }
        .rip-text {
            color: #ff3b30;
            font-size: 24px;
            font-weight: 700;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Screen 1: Are you primeminister? -->
        <div id="screen-1">
            <h2>Are you primeminister?</h2>
            <div class="btn-group">
                <button onclick="nextScreen('2a')">Yes</button>
                <button onclick="nextScreen('2b')">No</button>
            </div>
        </div>

        <!-- Screen 2a: Yes Path -->
        <div id="screen-2a" class="hidden">
            <h2>How much work does a primeminister do in 24 hours?</h2>
            <textarea placeholder="Type your answer here..."></textarea>
            <div class="btn-group">
                <button onclick="nextScreen('3')">Submit</button>
            </div>
        </div>

        <!-- Screen 2b: No Path -->
        <div id="screen-2b" class="hidden">
            <p>Why are you this much busy? 🤔</p>
            <div class="btn-group">
                <button onclick="nextScreen('3')">Next</button>
            </div>
        </div>

        <!-- Screen 3: Flip Screen -->
        <div id="screen-3" class="hidden">
            <h2>Should I Miss you or not?</h2>
            <div class="btn-group">
                <button onclick="nextScreen('4a')">Yes</button>
                <button onclick="nextScreen('4b')">No</button>
            </div>
        </div>

        <!-- Screen 4a: Answered Yes to missing -->
        <div id="screen-4a" class="hidden">
            <h2>Why? Do you love me? ❤️</h2>
            <div class="btn-group">
                <button onclick="nextScreen('final')">Yes</button>
                <button onclick="nextScreen('final')">No</button>
            </div>
        </div>

        <!-- Screen 4b: Answered No to missing -->
        <div id="screen-4b" class="hidden">
            <p>I knew it your answer will rude, by the way i think i should. 😏</p>
            <div class="btn-group">
                <button onclick="nextScreen('final')">Next</button>
            </div>
        </div>

        <!-- Final Screen -->
        <div id="screen-final" class="hidden">
            <p class="rip-text">Since you are rude, you should Rest in Peace 🪦👻</p>
        </div>
    </div>

    <script>
        function nextScreen(screenId) {
            // Hide every single screen container
            const screens = ['1', '2a', '2b', '3', '4a', '4b', 'final'];
            screens.forEach(id => {
                document.getElementById('screen-' + id).classList.add('hidden');
            });

            // Make the chosen screen visible
            document.getElementById('screen-' + screenId).classList.remove('hidden');
        }
    </script>
</body>
</html>
